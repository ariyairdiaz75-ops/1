<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1454"/>
      <stop offset="45%" stop-color="#17309e"/>
      <stop offset="100%" stop-color="#0a1454"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a5bd6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#3a5bd6" stop-opacity=".35"/>
      <stop offset="60%" stop-color="#3a5bd6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#274bd0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#274bd0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#streak)"/>
  <rect width="1600" height="900" fill="url(#floorGlow)"/>

  <!-- thumbnail grid hint -->
  <g filter="url(#soft)" opacity=".18">
    <rect x="60" y="40" width="90" height="60" fill="#ffb84d"/>
    <rect x="180" y="70" width="80" height="55" fill="#6ad1ff"/>
    <rect x="300" y="30" width="70" height="70" fill="#ff6ad1"/>
    <rect x="420" y="80" width="90" height="60" fill="#8dff6a"/>
    <rect x="560" y="40" width="75" height="65" fill="#ffe36a"/>
    <rect x="700" y="70" width="85" height="55" fill="#6a8dff"/>
    <rect x="850" y="35" width="70" height="70" fill="#ff8d6a"/>
    <rect x="980" y="75" width="90" height="55" fill="#c06aff"/>
    <rect x="1120" y="40" width="80" height="65" fill="#6affd1"/>
    <rect x="1260" y="70" width="85" height="55" fill="#ff6a8d"/>
    <rect x="1400" y="35" width="80" height="70" fill="#ffd16a"/>

    <rect x="100" y="160" width="80" height="60" fill="#6a8dff"/>
    <rect x="240" y="190" width="90" height="55" fill="#ff6a6a"/>
    <rect x="390" y="150" width="75" height="65" fill="#6affe3"/>
    <rect x="520" y="185" width="85" height="55" fill="#ffb36a"/>
    <rect x="660" y="155" width="80" height="65" fill="#d1ff6a"/>
    <rect x="800" y="190" width="90" height="55" fill="#ff6ac0"/>
    <rect x="950" y="150" width="75" height="65" fill="#6ac0ff"/>
    <rect x="1090" y="185" width="85" height="55" fill="#ffe36a"/>
    <rect x="1230" y="155" width="80" height="65" fill="#8d6aff"/>
    <rect x="1380" y="190" width="90" height="55" fill="#6aff8d"/>
  </g>

  <!-- outline accents -->
  <rect x="0" y="0" width="330" height="330" fill="none" stroke="#ff4fa0" stroke-width="4"
        transform="translate(60 -10) rotate(18)"/>
  <rect x="0" y="0" width="230" height="230" fill="none" stroke="#4d7dff" stroke-width="3"
        transform="translate(880 220) rotate(20)"/>
  <rect x="0" y="0" width="230" height="230" fill="none" stroke="#ff4fa0" stroke-width="3"
        transform="translate(1430 620) rotate(18)"/>
  <line x1="1500" y1="640" x2="1650" y2="900" stroke="#ff4fa0" stroke-width="3"/>

  <!-- cube: pink, top-left -->
  <g transform="translate(150 260)">
    <path d="M0,-70 L95,-22 L0,26 L-95,-22 Z" fill="#f6b9d1"/>
    <path d="M-95,-22 L0,26 L0,120 L-95,72 Z" fill="#c98aa6"/>
    <path d="M95,-22 L0,26 L0,120 L95,72 Z" fill="#eaa3c0"/>
    <path d="M0,-30 L34,-11 L0,8 L-34,-11 Z" fill="#c94f7f"/>
  </g>

  <!-- cube: red, upper right -->
  <g transform="translate(1400 195) scale(0.85)">
    <path d="M0,-70 L95,-22 L0,26 L-95,-22 Z" fill="#ff7a6a"/>
    <path d="M-95,-22 L0,26 L0,120 L-95,72 Z" fill="#a51f1f"/>
    <path d="M95,-22 L0,26 L0,120 L95,72 Z" fill="#d63030"/>
    <path d="M0,-30 L34,-11 L0,8 L-34,-11 Z" fill="#7a1414"/>
  </g>

  <!-- cube: gray, lower left -->
  <g transform="translate(120 800) scale(1.1)">
    <path d="M0,-70 L95,-22 L0,26 L-95,-22 Z" fill="#dfe3ec"/>
    <path d="M-95,-22 L0,26 L0,120 L-95,72 Z" fill="#7d859c"/>
    <path d="M95,-22 L0,26 L0,120 L95,72 Z" fill="#aab1c4"/>
    <path d="M0,-30 L34,-11 L0,8 L-34,-11 Z" fill="#3a5bd6"/>
  </g>

  <!-- cube: navy, bottom center -->
  <g transform="translate(980 830) scale(1.15)">
    <path d="M0,-70 L95,-22 L0,26 L-95,-22 Z" fill="#4a5fc7"/>
    <path d="M-95,-22 L0,26 L0,120 L-95,72 Z" fill="#131c56"/>
    <path d="M95,-22 L0,26 L0,120 L95,72 Z" fill="#28347f"/>
  </g>

  <!-- cube: small red, mid right -->
  <g transform="translate(1260 470) scale(0.7)">
    <path d="M0,-70 L95,-22 L0,26 L-95,-22 Z" fill="#ff7a6a"/>
    <path d="M-95,-22 L0,26 L0,120 L-95,72 Z" fill="#a51f1f"/>
    <path d="M95,-22 L0,26 L0,120 L95,72 Z" fill="#d63030"/>
  </g>
</svg>
