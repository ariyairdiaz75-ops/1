    <div class="hero__content">
      <svg class="logo-svg" viewBox="0 0 950 260" role="img" aria-label="MrROBUX">
        <defs>
          <filter id="roughEdge" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="7" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <mask id="diamondHole">
            <rect x="0" y="0" width="950" height="260" fill="#fff"/>
            <rect x="0" y="0" width="60" height="60" rx="8" fill="#000" transform="translate(500 95) rotate(22)"/>
          </mask>
          <style>
            .word {
              font-family: 'Arial Black', 'Arial Narrow', Impact, Haettenschweiler, sans-serif;
              font-weight: 900;
              fill: #ffffff;
              stroke: #14161c;
              stroke-width: 4;
              paint-order: stroke fill;
            }
          </style>
        </defs>

        <g filter="url(#roughEdge)">
          <g class="logo-letter logo-letter--1">
            <text x="10" y="190" font-size="150" class="word">Mr</text>
          </g>
          <g class="logo-letter logo-letter--2">
            <text x="235" y="200" font-size="185" class="word">R</text>
          </g>
          <g class="logo-letter logo-letter--3" mask="url(#diamondHole)">
            <rect x="0" y="0" width="118" height="118" rx="14"
                  fill="#ffffff" stroke="#14161c" stroke-width="6"
                  transform="translate(468 60) rotate(22)"/>
          </g>
          <g transform="translate(586 0) skewX(-6)">
            <g class="logo-letter logo-letter--4">
              <text x="0" y="190" font-size="150" letter-spacing="-2" class="word">BUX</text>
            </g>
          </g>
        </g>
